name: Privacy Guard

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  central-guard:
    uses: mehmetcerdik457-ctrl/.github/.github/workflows/reusable-privacy-guard.yml@328c770208878e97aa0765265b6201322fa39cd2

  phone-private-state:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Reject assistant memory and local state
        shell: bash
        run: |
          set -euo pipefail
          forbidden='(^|/)(ga-memory\.jsonl|ga-notes\.json|.*\.jsonl)$'
          if git ls-files | grep -E "$forbidden"; then
            echo "Forbidden assistant/private state is tracked."
            exit 1
          fi
          echo "PHONE_PRIVATE_STATE_GUARD=PASS"
